name: Bug Report
description: Report a bug in batonflow's scheduler, rate-limit detection, failover, or init command.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Exact command(s) or scenario that triggered the issue.
      placeholder: |
        1. Run `batonflow --tier high --task "..."`
        2. Codex hits a 429 rate limit
        3. Observe unexpected exit code / behavior
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect `batonflow` to do, and what happened instead?
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment (OS, Node.js, Planner & Executor CLIs)
      placeholder: "macOS 15.x, Node 20.18, Planner: Antigravity, Executors: codex / claude / gemini"
    validations:
      required: true

  - type: textarea
    id: config_and_logs
    attributes:
      label: Sanitized Config & Log Excerpt
      description: Please remove any secrets/API keys before pasting `batonflow.config.json` or `.batonflow/logs/*.log`.
      render: text
